/* ---------- COMPLIANCE MATRIX ---------- */
const MATRIX = {
  gst: { label: 'GST cycle', tpls: ['gst_m', 'gst_q'], cols: 'months' },
  gstr1: { label: 'GSTR-1', tpls: ['gst_m', 'gst_q'], cols: 'months', stage: 'r1f' },
  gstr3b: { label: 'GSTR-3B', tpls: ['gst_m', 'gst_q'], cols: 'months', stage: 'r3f' },
  pmt06: { label: 'PMT-06', tpls: ['pmt06'], cols: 'months' },
  cmp08: { label: 'CMP-08', tpls: ['cmp08'], cols: 'quarters' },
  tdsp: { label: 'TDS payment', tpls: ['tdsp'], cols: 'months' },
  tdsr: { label: 'TDS return', tpls: ['tdsr'], cols: 'quarters' },
  advtax: { label: 'Advance tax', tpls: ['advtax'], cols: 'at' },
  annual: { label: 'Annual (ITR · Audit · GSTR-9)', tpls: ['itr', 'tar', 'gst_ann', 'gstr4', 'stat_audit'], cols: 'annual' }
};
const Matrix = {
  cell(d, stageKey) {
    if (!d) return { cls: 'na', sym: '—', t: 'Not applicable / not tracked' };
    if (d.inactive) return { cls: 'na', sym: '·', t: 'Not applicable' };
    const t = U.today();
    if (stageKey) {
      const idx = d.stages.findIndex(s => s.key === stageKey);
      if (idx < 0) return { cls: 'na', sym: '—', t: 'Not applicable for this client' };
      const rec = d.wf.stages[stageKey], due = d.dues[idx];
      if (rec) return { cls: 'ok', sym: '✓', t: 'Filed ' + U.fmt(rec.date) + (rec.ref ? ' · ' + rec.ref : '') + (due && rec.date > due ? ' (after due date)' : '') };
      if (due && due < t) return { cls: 'over', sym: '✕', t: 'Overdue — due ' + U.fmt(due) };
      if (d.status === 'REQ' || d.status === 'WAIT') return { cls: 'wait', sym: '◷', t: 'Waiting for client since ' + U.fmt(d.wf.data.requestedOn) };
      if (d.status === 'BLK' || d.targetMissed || (due && U.diff(t, due) <= 2)) return { cls: 'att', sym: '⚠', t: d.st.label + ' — due ' + U.fmt(due) };
      return { cls: 'pend', sym: '○', t: d.st.label + (due ? ' — due ' + U.fmt(due) : '') };
    }
    if (d.completed) return { cls: 'ok', sym: '✓', t: 'Completed ' + U.fmt(d.wf.completedAt) };
    if (d.status === 'DOC') { const s = FileDocs.state(d); return { cls: 'fdoc', sym: '✓·', t: 'Filed ' + U.fmt(s.filed) + ' — documentation pending (' + s.got + '/' + s.n + ' papers on file)' }; }
    if (d.overdue) return { cls: 'over', sym: '✕', t: 'Overdue — ' + d.st.label };
    if (d.status === 'REQ' || d.status === 'WAIT') return { cls: 'wait', sym: '◷', t: 'Waiting for client' };
    if (d.status === 'BLK' || d.targetMissed || (d.daysLeft !== null && d.daysLeft <= 2)) return { cls: 'att', sym: '⚠', t: d.st.label + (d.blockReason ? ': ' + d.blockReason : '') };
    return { cls: 'pend', sym: '○', t: d.st.label };
  },
  // tabs with work in the selected FY (the annual tab always): a monthly GST / TDS / advance-tax grid only when some client has it
  avail() {
    const fy = Store.db.settings.fy, has = new Set();
    Store.db.workflows.forEach(w => { if (!w.deletedAt && !w.inactive && w.fy === fy) { const c = Store.client(w.clientId); if (c && !c.deletedAt) has.add(w.tpl); } });
    return Object.keys(MATRIX).filter(k => k === 'annual' || MATRIX[k].tpls.some(t => has.has(t)));
  },
  cur() { const a = Matrix.avail(); return a.includes(S.matrix) ? S.matrix : a[0]; },
  build() {
    const m = MATRIX[Matrix.cur()], fy = Store.db.settings.fy;
    const wfs = Store.db.workflows.filter(w => !w.deletedAt && m.tpls.includes(w.tpl) && w.fy === fy);
    const byClient = new Map();
    // one row per registration: a client's extra GSTIN gets its own row instead of overwriting the main one
    wfs.forEach(w => { const c = Store.client(w.clientId); if (!c || c.deletedAt) return; const rk = c.id + '|' + (w.gstin || ''); if (!byClient.has(rk)) byClient.set(rk, { c, reg: w.gstin ? Gstins.label(c, w.gstin) : '', items: {} }); byClient.get(rk).items[w.tpl + '|' + w.period] = D.get(w); });
    let cols;
    if (m.cols === 'months') cols = U.fyMonths(fy).map(ym => ({ label: U.MON[+ym.slice(5) - 1], key: ym, find: it => { const q = U.qOfMonth(+ym.slice(5)); const qm = U.qMonths(fy, q)[2]; return it['gst_m|' + ym] || it['pmt06|' + ym] || it['tdsp|' + ym] || (qm === ym ? it['gst_q|Q' + q] : null) || (it['gst_q|Q' + q] ? 'q' : null); } }));
    else if (m.cols === 'quarters') cols = [1, 2, 3, 4].map(q => ({ label: 'Q' + q, key: 'Q' + q, find: it => it[m.tpls[0] + '|Q' + q] }));
    else if (m.cols === 'at') cols = [1, 2, 3, 4].map(n => ({ label: ['', '15 Jun', '15 Sep', '15 Dec', '15 Mar'][n], key: 'AT' + n, find: it => it['advtax|AT' + n] || (it['advtax|AT4'] && n < 4 ? 'q' : null) }));
    else { const inc = U.fyShift(fy, -1); cols = [['itr', 'ITR · ' + U.itYearLabel(inc)], ['tar', 'Tax audit'], ['gst_ann', 'GSTR-9/9C'], ['gstr4', 'GSTR-4'], ['stat_audit', 'Stat. audit']].map(([t, l]) => ({ label: l, key: t, find: it => it[t + '|FY' + inc] })); }
    // a registration whose work this year is all marked Not Applicable has nothing to show
    const rows = [...byClient.values()].filter(r => Object.values(r.items).some(d => !d.inactive)).sort((a, b) => a.c.name.localeCompare(b.c.name) || a.reg.localeCompare(b.reg));
    return { m, cols, rows };
  },
  render() {
    const { m, cols, rows } = Matrix.build(), tabs = Matrix.avail(), on = Matrix.cur();
    let h = '<div class="row wrap" style="margin-bottom:14px;gap:12px"><div class="filters">' + (tabs.length > 1 ? tabs.map(k => '<button class="fchip" data-act="matrix" data-k="' + k + '" aria-pressed="' + (on === k) + '">' + E(MATRIX[k].label) + '</button>').join('') : '<b>' + E(MATRIX[on].label) + '</b>') + '</div><span class="spacer"></span><button class="btn sm" data-act="export-matrix">' + ic('download', 'sm') + 'Export</button></div>';
    h += '<div class="legend" style="margin-bottom:12px"><span><i class="mcell ok">✓</i>Completed</span><span><i class="mcell pend">○</i>Pending</span>' + (on === 'annual' ? '<span><i class="mcell fdoc">✓·</i>Filed — papers pending</span>' : '') + '<span><i class="mcell att">⚠</i>Attention required</span><span><i class="mcell over">✕</i>Overdue</span><span><i class="mcell wait">◷</i>Waiting for client</span><span><i class="mcell na">—</i>Not applicable</span></div>';
    if (!rows.length) return h + '<div class="card">' + empty('matrix', 'No ' + m.label + ' workflows in FY ' + Store.db.settings.fy, 'Workflows appear here automatically for clients to whom this compliance applies, as each period begins.') + '</div>';
    const colStats = cols.map(() => ({ ok: 0, n: 0 }));
    const body = rows.map(r => { let done = 0, n = 0;
      const cells = cols.map((col, i) => { const d = col.find(r.items); if (d === 'q') return '<td><span class="mcell na" title="Covered by the quarterly return">·</span></td>';
        const c = Matrix.cell(d, m.stage); if (d && c.cls !== 'na') { n++; colStats[i].n++; if (c.cls === 'ok') { done++; colStats[i].ok++; } }
        return '<td>' + (d ? '<button class="mcell ' + c.cls + '" data-act="open-wf" data-id="' + d.wf.id + '" title="' + E(r.c.name + ' · ' + col.label + ': ' + c.t) + '" aria-label="' + E(col.label + ': ' + c.t) + '">' + c.sym + '</button>' : '<span class="mcell na" title="Not applicable">—</span>') + '</td>'; }).join('');
      return '<tr><td><button class="link" data-act="open-client" data-id="' + r.c.id + '">' + E(r.c.name) + '</button><div class="small muted">' + (r.reg ? E(r.reg) + ' · ' : '') + done + '/' + n + ' done</div></td>' + cells + '</tr>'; }).join('');
    h += '<div class="card table-wrap"><table class="t matrix"><thead><tr><th>Client (' + rows.length + ')</th>' + cols.map((c, i) => '<th>' + E(c.label) + '</th>').join('') + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr><td class="small muted" style="font-weight:650">Completed</td>' + colStats.map(s => '<td class="small muted">' + (s.n ? s.ok + '/' + s.n : '') + '</td>').join('') + '</tr></tfoot></table></div>';
    return h;
  },
  csv() {
    const { m, cols, rows } = Matrix.build();
    const out = [['Client'].concat(cols.map(c => c.label))];
    rows.forEach(r => out.push([r.c.name + (r.reg ? ' (' + r.reg + ')' : '')].concat(cols.map(col => { const d = col.find(r.items); if (d === 'q') return 'Quarterly'; if (!d) return 'N/A'; const c = Matrix.cell(d, m.stage); return c.sym + ' ' + c.t; }))));
    U.download('Compliance_Matrix_' + m.label.replace(/\W+/g, '_') + '_FY' + Store.db.settings.fy + '.csv', U.toCSV(out), 'text/csv;charset=utf-8');
  }
};

/* ================== WORKFLOW DRAWER (single source detail view) ============= */
const Drawer = {
  open(id) { S.drawer = id; Drawer.render(); setTimeout(() => { const f = $('#drawerRoot .drawer .icon-btn'); if (f) f.focus(); }, 40); },
  close() { S.drawer = null; $('#drawerRoot').innerHTML = ''; },

/* ---------- CLIENTS ---------- */
function clientChips(c) {
  const e = Applic.effective(c), g = c.gst || {}, it = c.it || {}, out = [];
  const ra = Ref.acct(c); if (ra) { const y = Ref.year(c, Ref.curFy()); out.push('<span class="chip ' + (y ? 'outline' : 'warn') + '" title="' + E('Referred by ' + ra.name + (y ? '' : ' — not confirmed for ' + Ref.fyLabel(Ref.curFy()))) + '">' + ic('briefcase') + 'Via ' + E(ra.name) + (y ? '' : ' · not confirmed') + '</span>'); }
  if (ra) { const y = Ref.curFy(); (Ref.year(c, y) ? Ref.work(c, y) : Ref.possible(c)).forEach(t => out.push(chip(t === 'itr' ? it.itrForm || 'ITR' : t === 'gst_ann' ? (g.gstr9c ? 'GSTR-9/9C' : 'GSTR-9') : 'Tax audit', t === 'itr' ? 'teal' : t === 'tar' ? 'violet' : 'primary'))); } // only the work taken up
  else if (g.registered) out.push(g.frequency === 'NA' ? (e.gst_ann && e.gst_ann.on ? chip(g.gstr9c ? 'GSTR-9/9C' : 'GSTR-9', 'primary') : '') : chip(g.regType === 'Composition' ? 'GST Composition' : g.frequency === 'Quarterly' ? 'GST QRMP' : 'GST Monthly', 'primary'));
  if (!ra && e.itr && e.itr.on) out.push(chip(it.itrForm || 'ITR', 'teal'));
  if (!ra && e.tar && e.tar.on) out.push(chip('Tax audit', 'violet'));
  if (!ra && e.tdsp && e.tdsp.on) out.push(chip('TDS', 'info'));
  if (!ra && e.advtax && e.advtax.on) out.push(chip('Adv. tax', ''));
  if (!ra && e.stat_audit && e.stat_audit.on) out.push(chip('Stat. audit' + (c.co && c.co.roc ? ' + RoC' : ''), 'violet'));
  const ds = Dsc.state(c); // only problems get a chip; a valid DSC is shown in the profile
  if (ds && ds.st === 'expired') out.push(chip('DSC expired', 'bad', 'key'));
  else if (ds && ds.st === 'soon') out.push(chip('DSC expires ' + U.fmtS(ds.expiry), 'warn', 'key'));
  else if (ds && ds.st === 'none') out.push(chip(ds.n ? 'DSC expiry not set' : 'DSC not recorded', 'warn', 'key'));
  else if (ds && ds.n && !ds.auth) out.push(chip('No DSC signatory', 'warn', 'key'));
  return out.join(' ');
}
function clientStats(c) {
  const ds = Store.wfsOf(c.id).filter(w => !w.deletedAt).map(w => D.get(w)).filter(d => d.wf.fy === Store.db.settings.fy || (d.wf.fy < Store.db.settings.fy && d.open));
  return { open: ds.filter(d => d.open), overdue: ds.filter(d => d.overdue), waiting: ds.filter(d => d.status === 'REQ' || d.status === 'WAIT'), done: ds.filter(d => d.completed), all: ds };
}

const CloudUi = {
  people: null,
  async loadPeople() { try { CloudUi.people = { list: await Cloud.members(), at: Date.now() }; } catch (e) { CloudUi.people = { err: e.message, list: [], at: Date.now() }; } if (S.view === 'more' && S.sub === 'office') UI.render(); },
  person: id => ((CloudUi.people || {}).list || []).find(m => m.id === id),
  message(name, email, code) { const s = Store.db.settings; return 'Hello ' + name + ',\n\nYou can now use ' + APP_NAME + (s.firm ? ' for ' + s.firm : '') + '.\n\n1. Open this link on your computer or phone (and bookmark it):\n' + Cloud.staffLink() + '\n\n2. Sign in with your email ' + email + ' and this one-time password: ' + code + '\n\n3. Choose your own password when asked.\n\nPlease keep your password to yourself.'; },
  showCode(title, name, email, code) {
    const msg = CloudUi.message(name, email, code);
    Modal.open({ title, sub: 'Send this to ' + E(name) + ' on WhatsApp or by email', size: 'wide',
      body: '<div class="rkey" style="margin-bottom:8px">' + E(code) + '</div><p class="small muted" style="margin-bottom:12px">One-time password — it works until they choose their own password at the first sign-in.</p><textarea class="textarea" rows="11" readonly aria-label="Message to send">' + E(msg) + '</textarea>',
      foot: '<button type="button" class="btn" data-mact="copy">' + ic('copy', 'sm') + 'Copy message</button><button type="submit" class="btn primary">Done</button>',
      onAction: a => { if (a === 'copy') U.copy(msg).then(ok => Toast.show(ok ? 'Message copied' : 'Copy failed — select the text and copy it')); } });
  },
  busy(h, t) { const b = h.el.querySelector('[type=submit]'); if (b) { b.disabled = !!t; if (t) { b.dataset.l = b.dataset.l || b.textContent; b.textContent = t; } else if (b.dataset.l) b.textContent = b.dataset.l; } },
  add() {
    Modal.open({ title: 'Add staff member', sub: 'They sign in with their email and a one-time password that you send them.', size: 'wide',
      body: '<div class="form-grid"><label class="field"><span class="lbl">Name</span><input class="input" name="pn" autofocus></label><label class="field"><span class="lbl">Email</span><input class="input" type="email" name="pe"></label><label class="field full"><span class="lbl">Access</span><select class="select" name="pr"><option value="staff">Staff — pending work, stages, letters, documentation (no fees, settings or logins)</option><option value="admin">Admin — everything, including fees, settings and logins</option></select></label></div>',
      foot: '<button type="button" class="btn" data-mact="cancel">Cancel</button><button type="submit" class="btn primary">Create login</button>',
      onSubmit: async h => {
        const q = n => h.el.querySelector('[name=' + n + ']').value.trim(), n = q('pn'), e = q('pe').toLowerCase(), r = q('pr');
        if (!n) return Toast.err('Enter the name'); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return Toast.err('Enter a valid email address');
        if (((CloudUi.people || {}).list || []).some(m => (m.email || '').toLowerCase() === e)) return Toast.err('This email already has a login — use “Reset login” instead');
        CloudUi.busy(h, 'Creating…');
        try { const code = await Cloud.addPerson(n, e, r); h.close('ok'); CloudUi.loadPeople(); CloudUi.showCode('Login created for ' + n, n, e, code); }
        catch (x) { CloudUi.busy(h); Toast.err(x.message); }
      } });
  },
  async reset(id) {
    const m = CloudUi.person(id); if (!m) return;
    if (!await Modal.confirm('Reset login of ' + m.name + '?', '<p>Their current password stops working. You get a new one-time password to send them; they choose a new password when they sign in with it.</p>', { ok: 'Reset login' })) return;
    try { const code = await Cloud.resetPerson(m); CloudUi.loadPeople(); CloudUi.showCode('New one-time password for ' + m.name, m.name, m.email, code); } catch (x) { Toast.err(x.message); }
  },
  async active(id) {
    const m = CloudUi.person(id); if (!m) return;
    if (m.active && !await Modal.confirm('Switch off ' + m.name + '?', '<p>' + E(m.name) + ' can no longer sign in or see any office data. You can switch the login on again later.</p>', { ok: 'Switch off', danger: true })) return;
    try { await Cloud.setActive(id, !m.active); Toast.show(m.name + (m.active ? ' switched off' : ' switched on')); CloudUi.loadPeople(); } catch (x) { Toast.err(x.message); }
  },

  pw() {

      onSubmit: async h => { const p = h.el.querySelector('[name=p1]').value; if (p.length < min) return Toast.err('Use at least ' + min + ' characters'); if (p !== h.el.querySelector('[name=p2]').value) return Toast.err('The two passwords do not match');

  showKey(rk, intro) {

      foot: '<button type="button" class="btn" data-mact="copy">' + ic('copy', 'sm') + 'Copy</button><button type="submit" class="btn primary">Continue</button>',
      onAction: a => { if (a === 'copy') U.copy(rk).then(ok => Toast.show(ok ? 'Recovery Key copied — paste it somewhere safe' : 'Copy failed')); },

  setup() {
    if (Store.mode !== 'real') return Toast.err('Switch back to your own data first (More › Backup & restore › Back to my data)');
    const s = Store.db.settings, v = { url: '', key: '', name: s.caName || '', email: s.email || '' };
    let step = 0;
    const li = a => '<ol class="small" style="padding-left:18px;line-height:1.8">' + a.map(x => '<li style="margin-bottom:6px">' + x + '</li>').join('') + '</ol>';
    const f = (n, l, type, hint, extra) => '<label class="field' + (n === 'url' || n === 'key' ? ' full' : '') + '"><span class="lbl">' + l + '</span><input class="input" name="' + n + '" type="' + (type || 'text') + '" value="' + E(v[n] || '') + '"' + (extra || '') + '>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
    const draw = (h, msg) => {
      const body = h.el.querySelector('.modal-body'), foot = h.el.querySelector('.modal-foot');
      const back = '<button type="button" class="btn ghost" data-mact="back" style="margin-right:auto">Back</button>';
      if (step === 0) { body.innerHTML = '<p style="margin-bottom:12px">Create the online database once (about 10 minutes). You need a free Supabase account.</p>' + li([
          'Go to <b>supabase.com</b> › Sign up › <b>New project</b>. Name it e.g. <i>office-flow</i>, choose region <b>South Asia (Mumbai)</b>, set a database password (keep it; the app does not need it) and create the project.',
          'Open <b>SQL Editor</b> › <b>New query</b>, paste the setup script and press <b>Run</b>. <button type="button" class="btn xs" data-mact="sql">' + ic('copy', 'sm') + 'Copy setup script</button><br><span class="muted">The same script is saved next to this app as “' + E('Online office - Supabase setup.sql') + '”.</span>',
          'Open <b>Authentication</b> › <b>Sign In / Providers</b> › <b>Email</b>: turn <b>off “Confirm email”</b> and save. (You create every staff login yourself, so no confirmation emails are needed.)',
          'Open <b>Project Settings</b> › <b>API Keys</b> (or <b>Data API</b>): copy the <b>Project URL</b> and the <b>anon / publishable key</b> for the next step.']);
        foot.innerHTML = '<button type="button" class="btn" data-mact="cancel">Cancel</button><button type="submit" class="btn primary">I have done this — next</button>'; }
      if (step === 1) { body.innerHTML = (msg ? '<div class="gate-msg err">' + E(msg) + '</div>' : '') + '<div class="form-grid">' + f('url', 'Project URL', 'url', '', ' placeholder="https://abcd1234.supabase.co"') + f('key', 'anon / publishable key', 'text', 'Safe to put in the app — it only lets people reach the sign-in; the data stays locked.', ' autocomplete="off"') +
          f('name', 'Your name', 'text') + f('email', 'Your email (your login)', 'email') + f('pw', 'Your password', 'password', 'At least 10 characters. It unlocks the office data — nobody can reset it without your Recovery Key.', ' autocomplete="new-password"') + f('pw2', 'Repeat password', 'password', '', ' autocomplete="new-password"') + '</div>';
        foot.innerHTML = back + '<button type="submit" class="btn primary">Create the online office</button>'; }
      if (step === 3) { body.innerHTML = '<p>' + ic('clock', 'sm') + ' Encrypting and uploading your data — ' + Store.db.clients.length + ' clients, ' + Store.db.workflows.length + ' workflows, ' + Store.db.log.length + ' log entries…</p><p class="small muted" style="margin-top:8px" id="upProg">Starting…</p>' + (msg ? '<div class="gate-msg err" style="margin-top:12px">' + E(msg) + '</div>' : '');
        foot.innerHTML = msg ? '<button type="submit" class="btn primary">Try again</button>' : ''; }
      if (step === 4) { const db = Store.db; body.innerHTML = '<div class="gate-msg ok">' + ic('check', 'sm') + ' Your office is online — ' + db.clients.length + ' clients and ' + db.workflows.length + ' workflows uploaded, encrypted.</div>' + li(['Add your staff: <b>More › Online office › Add staff member</b>. Each gets a one-time password to send them.',
          'Put this app on a web address (e.g. GitHub Pages) and send staff the <b>staff link</b> from that address.', 'Your offline copy stays on this computer. From now on this computer signs in to the online office.']);
        foot.innerHTML = '<button type="submit" class="btn primary">Done</button>'; }
    };
    const upload = async h => { step = 3; draw(h); const p = () => { const el = $('#upProg'); if (el) el.textContent = 'Uploaded ' + (Cloud._t.base.size) + ' records…'; };
      try {
        if (Store.mode === 'cloud' && Store.db.clients.length) { await Cloud.push(); if (Cloud.err) throw new Error(Cloud.err); }
        else { const src = Store.mode === 'cloud' ? await Store.readCopy('real') : Store.db; if (!src) throw new Error('No offline data found in this browser to upload.'); await Cloud.upload(src, p); }
        step = 4; draw(h); UI.render(); } catch (x) { draw(h, x.message); } };
    Modal.open({ title: 'Set up the online office', size: 'wide', sticky: true, body: '', foot: '<span></span>', onMount: h => draw(h),
      onAction: (a, b, h) => { if (a === 'sql') return U.copy(Cloud.SQL).then(ok => Toast.show(ok ? 'Setup script copied — paste it in Supabase › SQL Editor' : 'Copy failed — open the .sql file next to the app instead')); if (a === 'back') { step--; draw(h); } },
      onSubmit: async h => {
        if (step === 0) { step = 1; return draw(h); }
        if (step === 1) {
          const q = n => (h.el.querySelector('[name=' + n + ']') || {}).value || '';
          Object.assign(v, { url: q('url').trim(), key: q('key').trim(), name: q('name').trim(), email: q('email').trim().toLowerCase() });
          if (!/^https:\/\//.test(v.url) && !/^http:\/\/(127\.0\.0\.1|localhost)/.test(v.url)) return Toast.err('Paste the Project URL — it starts with https://');
          if (v.key.length < 20) return Toast.err('Paste the anon / publishable key');
          if (!v.name) return Toast.err('Enter your name'); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return Toast.err('Enter your email');
          if (q('pw').length < 10) return Toast.err('Use a password of at least 10 characters'); if (q('pw') !== q('pw2')) return Toast.err('The two passwords do not match');
          CloudUi.busy(h, 'Creating…');
          let rk; try { rk = await Cloud.setup({ url: v.url, key: v.key, name: v.name, email: v.email, pw: q('pw'), firm: s.firm }); } catch (x) { CloudUi.busy(h); return draw(h, x.message); }
          step = 2; h.el.querySelector('.modal-body').innerHTML = '<p>Office created. Your Recovery Key is shown next.</p>'; h.el.querySelector('.modal-foot').innerHTML = '';
          while ((await CloudUi.showKey(rk, 'Your admin login is ready. This is the only way to open the office data if you ever forget your password.')) !== 'ok');
          return upload(h);
        }
        if (step === 3) return upload(h);
        if (step === 4) { h.close('ok'); Router.go('more/office'); }
      } });
  }
};

        '<label class="field full"><span class="lbl">Remarks / where the confirmation is kept <span class="muted">(optional)</span></span><input class="input" name="note" placeholder="e.g. Reply saved in client folder; approved with one change"></label></div>',

        if (!U.isDate(on) || on > t) return Toast.err('Enter the date the client confirmed (not in the future)');
        if (x.sentOn && on < x.sentOn) return Toast.err('Cannot be before it was sent (' + U.fmt(x.sentOn) + ')');

          const n = D.fresh(w); // the workflow's own "approved by client" stage (ITR) is this very confirmation; an open letter request is its own stage
          if (n.open && n.next && /approved by client/i.test(n.next.label) && !n.confOpen.some(i => !i.x.stage) && !(WF.completeStage(Store.db, w, n.next.key, { date: on, note: 'Client confirmation — ' + f.mode.value }) || {}).err) auto = n.next.label; });

/* Requesting letters for many workflows at once: one message per client listing every letter
   still needed from them (e.g. the Tax Information Letter and the representation letter together). */
const Letters = {
  items: list => list.map(o => { const wf = Store.wf(o.wid), d = wf && D.get(wf), s = d && d.stages.find(x => x.key === o.key && x.doc); return s && d.open && !wf.stages[s.key] && !Docs.askFor(d, s) ? { d, s } : null; }).filter(Boolean),
  replyBy: g => { const t = U.today(); let by = U.addDays(t, 3); g.forEach(({ d }) => { if (d.internal && d.internal > t && d.internal < by) by = d.internal; }); return by; },
  message(c, g) {
    const s = Store.db.settings;
    return Ref.readdress(c, 'Dear ' + Ref.to(c).name + ',\n\nGreetings from ' + (s.firm || 'our office') + '. To complete your work, we need the following signed letter' + (g.length > 1 ? 's' : '') + ' from you:\n\n' +
      g.map(({ d, s: l }, i) => (i + 1) + '. ' + l.doc + ' — ' + d.title + ', ' + d.label + (d.due ? ' (due ' + U.fmt(d.due) + ')' : '') + '\n   ' + Docs.askText(d, l)).join('\n\n') +
      '\n\nKindly send ' + (g.length > 1 ? 'them' : 'it') + ' by ' + U.fmt(Letters.replyBy(g)) + ' so that we can proceed before the due date' + (g.length > 1 ? 's' : '') + '.\n\nRegards,\n' + (s.caName || '') + '\n' + (s.firm || '')).replace(/\n{3,}/g, '\n\n').trim();
  },
  record(g, via) {
    const t = U.today(), by = Letters.replyBy(g);
    g.forEach(({ d, s }) => { const w = Store.db.workflows.find(x => x.id === d.wf.id); w.confs = w.confs || [];
      w.confs.push({ id: Docs.newId('F'), what: s.doc, details: '', by, sentOn: t, via, reminders: [], st: 'awaiting', on: '', mode: '', note: '', stage: s.key }); w.updatedAt = U.stamp();
      Log.add(Store.db, { cid: w.clientId, wid: w.id, act: 'confirm', text: WF.tag(d) + ' — ' + s.doc + ' requested from the client (' + via + '), reply by ' + U.fmt(by) }); });
  },
  bulk(list) {
    const items = Letters.items(list || []); if (!items.length) return Toast.show('Nothing left to request — every letter shown is requested or received');
    const byC = new Map(); items.forEach(x => { if (!byC.has(x.d.c.id)) byC.set(x.d.c.id, []); byC.get(x.d.c.id).push(x); });
    const body = '<p class="small muted" style="margin-bottom:12px">One message per client with every letter still needed from them. Each button records the request for that client; follow-ups then appear in the Letters report, the workflow and Notifications.</p>' + [...byC.values()].map(g => { const c = g[0].d.c;
      return '<div class="card card-pad" style="margin-bottom:10px;box-shadow:none" data-cid="' + c.id + '"><div class="row wrap" style="gap:6px"><b style="flex:1;min-width:160px">' + E(c.name) + '</b><span class="small muted">' + E(g.map(x => x.s.doc.replace(/ Letter$/, '') + ' · ' + x.d.tpl.short).join(', ')) + '</span><span data-done class="hide">' + chip('Requested', 'ok', 'check') + '</span></div>' +
        '<details style="margin:8px 0"><summary class="small link">Preview message</summary><div class="pre" style="margin-top:8px">' + E(Letters.message(c, g)) + '</div></details><div class="btn-group"><button type="button" class="btn xs" data-mact="b-copy" data-cid="' + c.id + '">' + ic('copy', 'sm') + 'Copy</button><button type="button" class="btn xs" data-mact="b-wa" data-cid="' + c.id + '"' + (Remind.canWa(c) ? '' : ' disabled title="No mobile in client master"') + '>' + ic('chat', 'sm') + 'WhatsApp</button><button type="button" class="btn xs" data-mact="b-email" data-cid="' + c.id + '"' + (Remind.who(c).email ? '' : ' disabled title="No email in client master"') + '>' + ic('mail', 'sm') + (Store.db.settings.emailVia === 'app' ? 'Email' : 'Gmail') + '</button></div></div>'; }).join('');
    const sent = new Set();
    Modal.open({ title: 'Request letters', sub: U.plural(items.length, 'letter') + ' · ' + U.plural(byC.size, 'client'), size: 'wide', body,
      foot: '<button type="button" class="btn" data-mact="cancel">Close</button><button type="button" class="btn primary" data-mact="all">Mark all as requested</button>',
      onAction: async (a, b, h) => {
        if (a === 'all') { const rest = [...byC.entries()].filter(([k]) => !sent.has(k)).map(([, g]) => g); if (!rest.length) { h.close('ok'); return; }
          Store.mutate('Request letters', () => rest.forEach(g => Letters.record(g, 'marked manually'))); h.close('ok'); return Toast.show(U.plural(rest.reduce((n, g) => n + g.length, 0), 'letter') + ' marked as requested', { undo: true }); }
        const g = byC.get(b.dataset.cid); if (!g || sent.has(b.dataset.cid)) return; const c = g[0].d.c, msg = Letters.message(c, g);
        const via = await DocUi.send(a.slice(2) === 'email' ? 'email' : a.slice(2), h, c, 'Letters required — ' + g.map(x => x.s.doc).join(', '), msg); if (!via) return;
        sent.add(c.id); Store.mutate('Request letters — ' + c.name, () => Letters.record(g, via));
        const card = h.el.querySelector('.card[data-cid="' + c.id + '"]'); if (card) { card.querySelector('[data-done]').classList.remove('hide'); card.style.opacity = '.7'; }
        Toast.show((a === 'b-copy' ? 'Copied · ' : '') + c.name + ' — ' + U.plural(g.length, 'letter') + ' requested');
      } });
  }
};

/* ===================== AUDITOR RESIGNATION (ADT-3 / ADT-1) ==================== */
/* Asks whether the auditor has resigned and, if so, starts one workflow covering the casual
   vacancy: ADT-3 by the outgoing auditor, board appointment, members' approval and ADT-1. */
const AuditorResign = {
  open(cid) {
    const c = Store.client(cid); if (!c) return;
    const cur = Store.wfsOf(cid).filter(w => w.tpl === 'adt' && !w.deletedAt).map(w => D.get(w)).find(d => d.open);
    if (cur) { Toast.show('An auditor-resignation workflow is already open for ' + c.name); return Drawer.open(cur.wf.id); }
    const t = U.today(), co = c.co || {};
    const plan = date => { const r = id => Rules.cfg(id).days, ok = U.isDate(date);
      return '<ol class="small" style="padding-left:18px;line-height:1.8">' +
        '<li>ADT-3 filed by the outgoing auditor — within ' + r('adt3') + ' days' + (ok ? ' (by <b>' + U.fmt(U.addDays(date, r('adt3'))) + '</b>)' : '') + ' <span class="muted">· Sec 140(2)</span></li>' +
        '<li>Consent & eligibility certificate from the new auditor <span class="muted">· Sec 139(1), 141</span></li>' +
        '<li>Board meeting appoints the new auditor — within ' + r('adtbm') + ' days' + (ok ? ' (by <b>' + U.fmt(U.addDays(date, r('adtbm'))) + '</b>)' : '') + ' <span class="muted">· Sec 139(8)(i)</span></li>' +
        '<li>General meeting (EGM) approves the appointment — within 3 months of the board meeting <span class="muted">· Sec 139(8)(i)</span></li>' +
        '<li>ADT-1 filed by the company — within ' + r('adt1') + ' days of the general meeting <span class="muted">· Rule 4(2)</span></li></ol>' +
        '<p class="small muted" style="margin-top:6px">The new auditor holds office until the conclusion of the next AGM.</p>'; };
    const body = '<div class="form-grid"><label class="field"><span class="lbl">Date of resignation <span style="color:var(--bad)">*</span></span><input class="input" type="date" name="date" max="' + t + '" required></label>' +
      '<label class="field"><span class="lbl">Outgoing auditor</span><input class="input" name="auditor" value="' + E(co.auditor || '') + '" placeholder="Name / firm"></label></div>' +
      '<div class="lbl" style="margin:16px 0 6px">Workflow that will be created</div><div data-plan>' + plan('') + '</div>';
    Modal.open({ title: 'Has the statutory auditor resigned?', sub: E(c.name) + ' · casual vacancy under the Companies Act, 2013', body,
      foot: '<button type="button" class="btn" data-mact="cancel">No, cancel</button><button type="submit" class="btn primary">' + ic('check', 'sm') + 'Yes — start workflow</button>',
      onMount: h => { const f = h.el.querySelector('form'); f.date.addEventListener('input', () => { f.querySelector('[data-plan]').innerHTML = plan(f.date.value); }); f.date.focus(); },
      onSubmit: h => {
        const f = h.el.querySelector('form'), date = f.date.value, who = f.auditor.value.trim();
        if (!U.isDate(date)) { Toast.err('Enter the date of resignation'); return f.date.focus(); }
        if (date > t) { Toast.err('Date cannot be in the future'); return f.date.focus(); }
        const wf = Store.mutate('Auditor resignation', db => {
          const w = WF.createManual(db, { tpl: 'adt', clientId: cid, title: 'Auditor resignation — ADT-3 / ADT-1', periodLabel: 'Resigned on ' + U.fmt(date) + (who ? ' · ' + who : ''), fy: U.fyOf(date) });
          w.stages.resig = { date, note: who ? 'Outgoing auditor: ' + who : '' };
          Log.add(db, { cid, wid: w.id, act: 'stage', text: 'Statutory auditor' + (who ? ' ' + who : '') + ' resigned on ' + U.fmt(date) + ' — ADT-3 due ' + U.fmt(U.addDays(date, Rules.cfg('adt3').days)) + ', board appointment due ' + U.fmt(U.addDays(date, Rules.cfg('adtbm').days)) });
          return w;
        });
        h.close('ok'); Toast.show('Auditor-resignation workflow created', { undo: true }); Drawer.open(wf.id);
      } });
  }
};

/* ======================= REMINDERS (copy / WhatsApp / email) ================= */
const Remind = {
  /* Who a message is sent to: the client, or — for a client referred by an accountant — the accountant
     (Ref.to). An accountant record passed directly ({acctRec}) is used as is. */
  who: c => c && c.acctRec ? { acct: true, a: c, name: c.name, mobile: c.mobile || '', email: c.email || '' } : Ref.to(c),
  waLink(c, msg) { const m = V.mobile(Remind.who(c).mobile); if (!m.ok || m.empty) return null; return 'https://wa.me/' + (Store.db.settings.waCode || '91') + m.n + '?text=' + encodeURIComponent(msg); },

    const rec = Object.assign({ acctRec: true }, a), n = groups.reduce((t, g) => t + g.items.length, 0);

      body: '<div class="field"><label class="lbl" for="rq-msg">Message</label><textarea id="rq-msg" class="textarea" rows="16">' + E(msg) + '</textarea><span class="hint">Sending records a data request (or reminder) on each workflow waiting for data and a letter request on each letter listed.</span></div>',

  async acctSend(k, h, rec, groups, inc) {

    const via = via0 + ' (to ' + rec.name + ')', t = U.today();
    Store.mutate('Request — ' + rec.name, db => groups.forEach(g => g.items.forEach(x => { const w = db.workflows.find(y => y.id === x.d.wf.id); if (!w) return;
      if (!x.letter) return WF.requestData(db, w, { via });
      w.confs = w.confs || []; const open = w.confs.find(y => y.stage === x.letter.key && y.st !== 'confirmed' && !y.closed);
      if (open) open.reminders = (open.reminders || []).concat([t]);
      else w.confs.push({ id: Docs.newId('F'), what: x.letter.doc, details: '', by: U.addDays(t, 3), sentOn: t, via, reminders: [], st: 'awaiting', on: '', mode: '', note: '', stage: x.letter.key });
      w.updatedAt = U.stamp(); Log.add(db, { cid: w.clientId, wid: w.id, act: 'confirm', text: WF.tag(D.fresh(w)) + ' — ' + x.letter.doc + (open ? ' reminder' : ' requested') + ' via ' + via }); })));

  bulk(ids) {

    // an entity's ITR whose data comes with its tax audit is not asked for separately when the audit is asked too

    const s0 = Store.db.settings;
    byC.forEach(g => { if (!g.acct) { g.msg = WF.combinedMessage(g.ds[0].c, g.ds); g.title = g.ds[0].c.name; return; }
      const cl = new Map(); g.ds.forEach(d => { if (!cl.has(d.c.id)) cl.set(d.c.id, []); cl.get(d.c.id).push(d); });
      const list = [...cl.values()].map((x, i) => (i + 1) + '. ' + x[0].c.name + (x[0].c.pan ? ' (PAN ' + x[0].c.pan + ')' : '') + '\n' + x.map(d => '   - ' + d.tpl.short + ' ' + d.label + ': ' + WF.requirementOf(d) + (d.due ? ' (due ' + U.fmt(d.due) + ')' : '')).join('\n')).join('\n\n');
      g.msg = s0.msg.acctCombined.replace(/\{(\w+)\}/g, (m, k) => ({ name: g.to.name, firm: s0.firm || 'our office', ca: s0.caName || '', list, fy: '' })[k] ?? m).replace(/\n{3,}/g, '\n\n').trim();
      g.title = g.to.name + ' (accountant) · ' + U.plural(cl.size, 'client'); });
    const body = '<p class="small muted" style="margin-bottom:12px">One message per person: each client, or each accountant for all the clients they referred. Each button records the request for those items only.</p>' + [...byC.values()].map(g => '<div class="card card-pad" style="margin-bottom:10px;box-shadow:none" data-cid="' + g.k + '"><div class="row"><b style="flex:1">' + E(g.title) + '</b><span class="small muted">' + U.plural(g.ds.length, 'item') + '</span><span data-done class="hide">' + chip('Requested', 'ok', 'check') + '</span></div><details style="margin:8px 0"><summary class="small link">Preview message</summary><div class="pre" style="margin-top:8px">' + E(g.msg) + '</div></details><div class="btn-group"><button type="button" class="btn xs" data-mact="b-copy" data-cid="' + g.k + '">' + ic('copy', 'sm') + 'Copy</button><button type="button" class="btn xs" data-mact="b-wa" data-cid="' + g.k + '"' + (Remind.canWa(g.to) ? '' : ' disabled') + '>' + ic('chat', 'sm') + 'WhatsApp</button><button type="button" class="btn xs" data-mact="b-email" data-cid="' + g.k + '"' + (Remind.who(g.to).email ? '' : ' disabled') + '>' + ic('mail', 'sm') + (s0.emailVia === 'app' ? 'Email' : 'Gmail') + '</button></div></div>').join('');
    Modal.open({ title: 'Prepare data requests', sub: U.plural(ds.length, 'workflow') + ' · ' + U.plural(byC.size, 'message'), size: 'wide', body,
      foot: '<button type="button" class="btn" data-mact="cancel">Close</button><button type="button" class="btn primary" data-mact="all">Mark all ' + ds.length + ' as requested</button>',
      onAction: async (a, b, h) => {

        const g = byC.get(b.dataset.cid); if (!g) return; const to = g.to, msg = g.msg;
        let via = 'copied message';
        if (a === 'b-copy') await U.copy(msg);
        if (a === 'b-wa') { const l = Remind.waLink(to, msg); if (!l) return Toast.err('No valid mobile number for ' + Remind.who(to).name); window.open(l, '_blank', 'noopener'); via = 'WhatsApp'; }

        Toast.show((a === 'b-copy' ? 'Copied · ' : '') + (g.acct ? to.name + ': ' : '') + U.plural(g.ds.length, 'item') + ' marked as requested');

/* ============================ STAGE / FILING DIALOG ========================= */
const Stage = {
  // one-click stage completion; filing/verification stages ask only for the evidence that matters
  run(id, key, sure) {
    const wf = Store.wf(id), d = D.get(wf), s = d.stages.find(x => x.key === key);
    if (!s) return;
    if (s.fdoc) return FileDocs.open(id); // tick the papers put on file
    if (s.doc) return Stage.dialog(d, s, []); // a letter is recorded when it arrives; earlier stages stay as they are
    const lack = Docs.missing(d, d.stages.indexOf(s));
    if (lack.length) { const l = lack[0], ask = Docs.askFor(d, l); // the letter must be on file first
      return Modal.open({ title: l.doc + ' not received', sub: E(d.c.name + ' · ' + d.title + ' · ' + d.label),
        body: '<p>The <b>' + E(l.doc) + '</b> must be obtained from the client before ' + E(l.before || 'this step') + '. “' + E(s.label) + '” can be marked once it is recorded as received.</p>' + (ask ? '<p class="small muted" style="margin-top:8px">Requested on ' + U.fmt(ask.x.sentOn) + ' · ' + U.plural(ask.days, 'day') + ' waiting.</p>' : '') +
          '<p class="small muted" style="margin-top:8px">If the client has approved and the signed copy will come later, choose <b>Proceed — receive later</b>: the work goes ahead and the letter stays on the pending list until it is received.</p>',
        foot: '<button type="button" class="btn" data-mact="cancel">Not yet</button>' + (ask ? '<button type="button" class="btn" data-mact="remind">' + ic('send', 'sm') + 'Remind client</button>' : '<button type="button" class="btn" data-mact="ask">' + ic('send', 'sm') + 'Request from client</button>') + '<button type="button" class="btn" data-mact="hold" title="Go ahead now; track the signed copy until it arrives">' + ic('pause', 'sm') + 'Proceed — receive later</button><button type="submit" class="btn primary">' + ic('check', 'sm') + 'Record as received</button>',
        onAction: (a, b, h) => { h.close('ok'); if (a === 'ask') DocUi.ask(id, null, l.key); if (a === 'remind') DocUi.remind(id, ask.x.id); if (a === 'hold') Stage.hold(d, l, () => Stage.run(id, key, sure)); },
        onSubmit: h => { h.close('ok'); Stage.dialog(d, l, []); } }); }
    if (!sure && s.kind === 'file' && d.confOpen.length) // filing before the client has approved: make it a conscious choice
      return Modal.confirm('The client has not confirmed yet', '<p>Still open for ' + E(d.c.name) + ':</p><ul class="small" style="padding-left:18px;margin:8px 0">' + d.confOpen.map(i => '<li><b>' + E(i.x.what) + '</b> — ' + E(Docs.label(i).toLowerCase()) + (i.x.note && i.x.st === 'changes' ? ': ' + E(i.x.note) : '') + '</li>').join('') + '</ul><p class="small muted">You can record the confirmation first from the workflow panel, or continue if the client approved in some other way.</p>', { ok: 'Continue anyway', cancel: 'Not yet' }).then(ok => ok && Stage.run(id, key, true));
    const idx = d.stages.indexOf(s);
    for (let j = 0; j <= idx; j++) { const dep = D.depOk(wf, d.stages[j]); if (!wf.stages[d.stages[j].key] && !dep.ok) return Toast.err('Blocked — ' + dep.reason + '. Complete it first.'); }
    const skipped = d.stages.slice(0, idx).filter(x => !wf.stages[x.key]);
    if (s.kind === 'file' || s.kind === 'verify' || d.stages.some(x => x.event === s.key)) return Stage.dialog(d, s, skipped); // event stages: later dues run from this date
    if (skipped.length > 1) return Modal.confirm('Mark "' + s.label + '"?', '<p>These earlier stages will also be marked done today:</p><ul class="small" style="padding-left:18px">' + skipped.map(x => '<li>' + E(x.label) + '</li>').join('') + '</ul>', { ok: 'Mark done' }).then(ok => ok && Stage.apply(id, key, {}));
    Stage.apply(id, key, {});
  },
  apply(id, key, info) {
    const r = Store.mutate('Stage', db => WF.completeStage(db, db.workflows.find(w => w.id === id), key, info));
    if (r && r.err) return Toast.err(r.err);
    const d = D.get(Store.wf(id));
    Toast.show(r.completed ? '✓ ' + d.c.name + ' · ' + d.title + ' completed' : '✓ ' + (d.stages.find(x => x.key === key) || {}).label + (r.next ? ' · next: ' + r.next.label : '') + (r.itr ? ' · ITR data marked received too' : ''), { undo: true });
  },
  /* "Mark as complete…" from the row menu: every pending stage on one date, with the acknowledgement number of the
     filing and, for a letter not yet in hand, the choice to receive it later. */
  completeAll(id) {
    const wf = Store.wf(id), d = D.get(wf); if (!d.open || !d.next) return Toast.show('Already completed');
    const sub = E(d.c.name + ' · ' + d.title + ' · ' + d.label), pend = d.stages.filter(s => !wf.stages[s.key]);
    const bad = pend.find(s => !D.depOk(wf, s).ok);
    if (bad) { const dep = D.depOk(wf, bad);
      return Modal.open({ title: 'Cannot complete yet', sub, body: '<p><b>' + E(dep.reason) + '</b>. “' + E(bad.label) + '” waits for it, so complete that work first.</p>',
        foot: '<button type="button" class="btn" data-mact="cancel">Close</button>' + (dep.wf ? '<button type="button" class="btn primary" data-mact="dep">' + ic('eye', 'sm') + 'Open ' + E(TPL[dep.wf.tpl].name) + '</button>' : ''),
        onAction: (a, b, h) => { if (a === 'dep') { h.close('ok'); Drawer.open(dep.wf.id); } } }); }
    const t = U.today(), set = Store.db.settings, last = Object.values(wf.stages).map(x => x && x.date).filter(U.isDate).sort().pop() || '';
    const refS = pend.find(s => s.kind === 'file' && s.ref) || pend.find(s => s.ref), letters = pend.filter(s => s.doc);
    const body = '<p class="small" style="margin-bottom:10px">These stages will be marked done on the date below:</p><ul class="small" style="padding-left:18px;margin:0 0 14px">' + pend.map(s => '<li>' + E(s.label) + '</li>').join('') + '</ul>' +
      '<div class="form-grid"><label class="field"><span class="lbl">Completed on</span><input class="input" type="date" name="date" value="' + t + '" max="' + t + '"' + (last ? ' min="' + last + '"' : '') + ' required></label>' +
      (refS ? '<label class="field"><span class="lbl">' + E(refS.ref) + (set.requireRef ? ' <span style="color:var(--bad)">*</span>' : ' <span class="muted">(optional)</span>') + '</span><input class="input mono" name="ref" autocomplete="off"></label>' : '') +
      letters.map(s => '<label class="field"><span class="lbl">' + E(s.doc) + '</span><select class="select" name="L_' + s.key + '"><option value="recd">Received on this date</option><option value="held">Not yet — receive later</option></select></label>').join('') +
      '<label class="field full"><span class="lbl">Remarks <span class="muted">(optional)</span></span><input class="input" name="note" placeholder="e.g. Filed from the portal directly; updated here later"></label></div>' +
      (letters.length ? '<p class="small muted" style="margin-top:10px">A letter marked “receive later” stays on the pending list (Letters report, Waiting centre, client page) until the signed copy is recorded.</p>' : '') +
      (d.confOpen.length ? '<p class="small muted" style="margin-top:8px">' + U.plural(d.confOpen.length, 'open client confirmation') + ' will be closed.</p>' : '') +
      (wf.blocked && wf.blocked.on ? '<p class="small muted" style="margin-top:8px">The “blocked” mark (' + E(wf.blocked.reason || 'Blocked') + ') will be cleared.</p>' : '');
    Modal.open({ title: 'Mark as complete', sub, body,
      foot: '<button type="button" class="btn" data-mact="cancel">Cancel</button><button type="submit" class="btn primary">' + ic('check', 'sm') + 'Mark complete</button>',
      onSubmit: h => { const f = h.el.querySelector('form'), date = f.date.value;
        if (!U.isDate(date) || date > t) return Toast.err('Enter the completion date (not in the future)');
        if (last && date < last) return Toast.err('A stage was already recorded on ' + U.fmt(last) + ' — the date cannot be earlier');

  async run(k, anchor) {

    if (k === 'received') {

    }
  }

/* ============================ BACKUP & RESTORE ============================== */
/* Backups go to a folder the user picks once (File System Access API, Chrome / Edge). The folder
   handle is kept in IndexedDB so later backups need no picker — at most a one-click permission
   prompt per session. Browsers never reveal or accept a typed path, so the folder is chosen with
   the system dialog and shown by name. Without the API (or if permission is refused) the JSON is
   downloaded to the Downloads folder as before. */
const BackupDir = {
  supported: () => typeof window.showDirectoryPicker === 'function',
  _db() { return new Promise((res, rej) => { const r = indexedDB.open('officeflow-handles', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get() { try { const db = await BackupDir._db(); return await new Promise(res => { const q = db.transaction('h').objectStore('h').get('backupDir'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(h) { const db = await BackupDir._db(); await new Promise((res, rej) => { const tx = db.transaction('h', 'readwrite'); h ? tx.objectStore('h').put(h, 'backupDir') : tx.objectStore('h').delete('backupDir'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); BackupDir.name = h ? h.name : ''; Store.lsSet('of.backupDir', BackupDir.name); },
  name: '',
  async choose() {
    if (!BackupDir.supported()) { Toast.err('This browser cannot save into a chosen folder — use Microsoft Edge or Google Chrome. Backups will go to Downloads.'); return null; }
    try { const h = await window.showDirectoryPicker({ id: 'of-backup', mode: 'readwrite', startIn: 'documents' }); await BackupDir.set(h); Toast.show('Backups will be saved in “' + h.name + '”'); UI.render(); return h; }
    catch (e) { if (e && e.name !== 'AbortError') Toast.err('Could not use that folder — ' + e.message); return null; }
  },
  async forget() { await BackupDir.set(null); Toast.show('Backup folder removed — backups go to Downloads'); UI.render(); },
  async writable() { // the saved folder, with write permission (asks once per session)
    const h = await BackupDir.get(); if (!h) return null;
    try { const o = { mode: 'readwrite' }; if ((await h.queryPermission(o)) === 'granted' || (await h.requestPermission(o)) === 'granted') return h; } catch (e) {}
    return null;
  },
  async write(name, text) { const h = await BackupDir.writable(); if (!h) return null; const fh = await h.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close(); return h.name; }
};
const Backup = {
  // the file records itself as the last backup, so a restored copy does not report an older one
  payload: () => ({ app: 'OfficeFlow', kind: 'backup', schema: 1, exportedAt: new Date().toISOString(), mode: Store.mode, data: Object.assign({}, Store.db, { meta: Object.assign({}, Store.db.meta, { lastBackup: U.stamp() }) }) }),
  fileName: suffix => { const n = new Date(); return 'Sriram_Office_Flow_Backup_' + (Store.mode === 'demo' ? 'DEMO_' : '') + (suffix || '') + U.today() + '_' + U.pad(n.getHours()) + U.pad(n.getMinutes()) + '.json'; },
  // folder if chosen, else download. The JSON is built synchronously, so a later change cannot leak in.
  async save(name, silent) {
    const text = JSON.stringify(Backup.payload(), null, 1);
    let where = null; try { where = await BackupDir.write(name, text); } catch (e) { if (!silent) Toast.err('Could not write to the backup folder (' + e.message + ') — downloading instead'); }
    if (!where) U.download(name, text, 'application/json');
    return where;
  },
  async download(silent) {

      if (go) await BackupDir.choose();

    if (!silent) Toast.show(where ? 'Backup saved in “' + where + '” as ' + name : 'Backup downloaded — keep it somewhere safe');
  },
  safety(tag) { return Backup.save(Backup.fileName('before_' + tag + '_'), true); },
  /* Once a day, into the chosen folder, without asking: only when the browser already allows writing there
     (no permission prompt), only in the tab that edits, real data only. Old automatic copies are pruned. */
  async auto() {

      if (!where) return null;
      Store.mutate('Automatic backup', d => { d.meta.lastBackup = U.stamp(); Log.add(d, { act: 'backup', text: 'Automatic daily backup saved to folder “' + where + '” (' + d.clients.length + ' clients, ' + d.workflows.length + ' workflows)' }); }, { undo: false, silent: true });
      const old = U.addDays(t, -30);
      for await (const [n, e] of h.entries()) { const m = e.kind === 'file' && n.startsWith(pre) && n.slice(pre.length, pre.length + 10); if (m && U.isDate(m) && m < old) await h.removeEntry(n).catch(() => {}); }
      return where;
    } catch (e) { return null; }
  },
  async pick() {

      catch (e) { if (e && e.name === 'AbortError') return; }

  validate(obj) {

      '<td style="min-width:118px"><input class="input sm mono' + au('pan') + '" data-k="pan" value="' + E(c.pan) + '" maxlength="10" aria-label="PAN"></td>' +

      '<td style="min-width:92px"><select class="select sm' + au('it.itrForm') + '" data-k="itrForm" aria-label="ITR form">' + (c.it.itr ? ['ITR-1', 'ITR-2', 'ITR-3', 'ITR-4', 'ITR-5', 'ITR-6', 'ITR-7'].map(x => opt(x, x, c.it.itrForm)).join('') + opt('none', 'No ITR', '') : opt('none', 'No ITR', 'none') + ['ITR-1', 'ITR-2', 'ITR-3', 'ITR-4', 'ITR-5', 'ITR-6', 'ITR-7'].map(x => opt(x, x, '')).join('')) + '</select></td>' +

  async preview(input, src) {

      foot: '<button type="button" class="btn" data-mact="cancel">Cancel</button><button type="submit" class="btn primary" data-go></button>',
      onMount: h => Importer.bindGrid(h, st),
      onSubmit: h => {
        const ae = document.activeElement; if (ae && ae.closest && ae.closest('.imp-tbl') && ae.tagName === 'INPUT' && ae.type !== 'checkbox') { ae.blur(); return; } // Enter in a cell commits the cell
        if (!st.rows.some(r => Importer.uses(r, st))) return Toast.err(st.rows.some(r => r.status === 'err') ? 'Correct the rows marked in red, or untick them' : 'Nothing to import');

  },
  bindGrid(h, st) {
    const f = h.el.querySelector('form'), tb = f.querySelector('tbody');
    const refresh = () => {
      Importer.rebuild(st);
      $$('tr[data-i]', tb).forEach(tr => {
        const r = st.rows[+tr.dataset.i], tmp = document.createElement('tbody'); tmp.innerHTML = Importer.rowHtml(r, st); const nt = tmp.firstChild;
        if (!tr.contains(document.activeElement)) { tr.replaceWith(nt); return; }
        tr.className = nt.className; tr.dataset.st = nt.dataset.st;
        $$('[data-cell]', nt).forEach(x => { const o = tr.querySelector('[data-cell="' + x.dataset.cell + '"]'); if (o) o.innerHTML = x.innerHTML; });
        $$('[data-k]', nt).forEach(x => { const o = tr.querySelector('[data-k="' + x.dataset.k + '"]'); if (!o || o === document.activeElement) return;
          o.className = x.className; o.title = x.title; o.disabled = x.disabled;
          if (o.type === 'checkbox') o.checked = x.checked; else if (o.tagName === 'SELECT') { o.innerHTML = x.innerHTML; o.value = x.value; } else o.value = x.value; });
      });
      Importer.summary(f, st);
    };
    st.refresh = refresh;
    tb.addEventListener('change', e => {
      const el = e.target, tr = el.closest('tr[data-i]'); if (!tr || !el.dataset.k) return;
      const r = st.rows[+tr.dataset.i], k = el.dataset.k;
      if (k === 'use') { r.skip = !el.checked; if (el.checked && r.status === 'dup') st.upd = true; } // ticking an existing client = update it
      else if (k === 'itrForm') { if (el.value === 'none') r.edit.itr = 'N'; else { r.edit.itr = 'Y'; r.edit.itrForm = el.value; } }
      else r.edit[k] = el.value;
      refresh();
    });
    f.querySelector('.imp-defs').addEventListener('change', e => { const n = e.target.name; if (!n) return; st.defs[n.slice(2)] = e.target.value; refresh(); });
    f.addEventListener('click', e => {
      const b = e.target.closest('[data-flt]'); if (b) { e.preventDefault(); st.filter = b.dataset.flt; Importer.summary(f, st); }
    });
    f.addEventListener('change', e => { if (e.target.name === 'upd') { st.upd = e.target.checked; refresh(); } });
    Importer.summary(f, st);
  },
  summary(f, st) {
    const R = st.rows, ready = R.filter(r => r.status === 'ok' && !r.skip), fix = R.filter(r => r.status === 'err'), dup = R.filter(r => r.status === 'dup'), upd = R.filter(r => Importer.uses(r, st) && r.status === 'dup');
    const autoN = ready.reduce((s, r) => s + Object.values(r.auto).filter(v => v !== 'Office default').length, 0);
    const wfN = Gen.plan(Gen.fysToScan(), Importer.merged(st, ready)).length;
    const extra = ready.filter(r => r.main).length, newC = ready.length - extra;
    f.querySelector('[data-saved]').innerHTML = ready.length ? '<div class="imp-saved">' + ic('spark') + '<div><b>' + autoN + '</b> details filled in automatically for ' + U.plural(ready.length, 'row') + ' — about <b style="font-size:inherit">' + Math.max(1, Math.round(autoN * 8 / 60)) + ' min</b> of typing saved. <span style="color:var(--text-2)">' + U.plural(wfN, 'workflow') + ' with due dates will be created.</span></div></div>' : '';
    f.querySelector('[data-sum]').innerHTML = chip(U.plural(newC, 'new client') + ' ready', 'ok', 'check') + (extra ? chip('+ ' + U.plural(extra, 'more GSTIN') + ' saved under the same client (same PAN)', 'info', 'layers') : '') + (fix.length ? chip(fix.length + ' to correct', 'bad', 'alert') : '') + (dup.length ? chip(dup.length + ' already exist', 'warn') : '') + (R.some(r => r.skip && r.status === 'ok') ? chip(R.filter(r => r.skip && r.status === 'ok').length + ' unticked', '') : '');
    const flt = [['all', 'All', R.length], ['err', 'To correct', fix.length], ['dup', 'Already exist', dup.length], ['ok', 'Ready', R.filter(r => r.status === 'ok').length]].filter(([k, , n]) => k === 'all' || n);
    if (!flt.some(([k]) => k === st.filter)) st.filter = 'all';
    f.querySelector('[data-filters]').innerHTML = flt.length > 2 ? flt.map(([k, l, n]) => '<button type="button" class="fchip" data-flt="' + k + '" aria-pressed="' + (st.filter === k) + '">' + l + ' <span class="n">' + n + '</span></button>').join('') : '';
    $$('tr[data-i]', f).forEach(tr => tr.classList.toggle('hide', st.filter !== 'all' && tr.dataset.st !== st.filter));
    const canUpd = dup.filter(r => r.ex && r.fill.length).length;
    const ub = f.querySelector('[data-upd]');
    if (!canUpd) ub.innerHTML = ''; else if (!ub.querySelector('input')) ub.innerHTML = '<label class="switch small" style="margin-bottom:8px"><input type="checkbox" name="upd"' + (st.upd ? ' checked' : '') + '><span data-updl></span></label>';
    if (canUpd) ub.querySelector('[data-updl]').textContent = 'Also update ' + U.plural(canUpd, 'existing client') + ' with details they are missing (mobile, email, TAN, DSC expiry…) — nothing already filled is changed';
    const go = f.querySelector('[data-go]');
    go.innerHTML = ic('check', 'sm') + (ready.length ? 'Import ' + (newC ? U.plural(newC, 'client') : '') + (newC && extra ? ' + ' : '') + (extra ? U.plural(extra, 'GSTIN') : '') : '') + (ready.length && upd.length ? ' & ' : '') + (upd.length ? 'update ' + U.plural(upd.length, 'client') : '') + (!ready.length && !upd.length ? 'Import' : '');
    go.disabled = !ready.length && !upd.length;
  },
  commit(st) {
    const ok = st.rows.filter(r => r.status === 'ok' && !r.skip), upd = st.rows.filter(r => r.status === 'dup' && Importer.uses(r, st));
    let created = 0;
    const mains = ok.filter(r => !r.main), extras = ok.filter(r => r.main), touched = new Map();
    Store.mutate('Import ' + U.plural(mains.length, 'client') + (extras.length ? ' + ' + U.plural(extras.length, 'GSTIN') : '') + (upd.length ? ', update ' + upd.length : ''), db => {
      const byI = {};
      mains.forEach(r => { const c = r.c; c.id = Store.nextId('client'); byI[r.i] = c; c.createdAt = c.updatedAt = U.stamp(); db.clients.push(c); });
      // same PAN: the GSTIN goes into the client of the earlier row, or into the client already on file
      extras.forEach(r => { const m = r.main.i != null ? byI[r.main.i] : db.clients.find(x => x.id === r.main.id); if (!m) return;
        const how = Importer.attach(m, r); if (!how) return;
        if (r.main.id) { m.updatedAt = U.stamp(); touched.set(m.id, m); Log.add(db, { act: 'client', cid: m.id, text: 'GSTIN ' + r.c.gstin + ' (' + (V.STATES[r.c.state] || r.c.state) + ') added from import' }); } });
      upd.forEach(r => { const ex = db.clients.find(x => x.id === r.ex.id); if (!ex) return;
        r.fill.forEach(({ p, v }) => { const ps = p.split('.'); let o = ex; for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]] = o[ps[i]] || {}; o[ps[ps.length - 1]] = v; });
        if (ex.dsc && ex.dsc.expiry) ex.dsc.available = true;
        Dsc.fix(ex);
        ex.updatedAt = U.stamp(); Log.add(db, { act: 'edit', cid: ex.id, text: 'Updated from import: ' + r.fill.map(f => f.l).join(', ') }); });
      Log.add(db, { act: 'import', text: 'Imported ' + U.plural(mains.length, 'client') + (extras.length ? ' and ' + U.plural(extras.length, 'additional GSTIN') : '') + (upd.length ? ', updated ' + U.plural(upd.length, 'client') : '') + ' from a client list' });
      Gen.plan(Gen.fysToScan(), mains.map(r => r.c).concat([...touched.values()])).forEach(pl => { Gen.create(db, pl); created++; });
    });
    if (ok.length && st.defs.freq !== 'NA') Store.lsSet('of.rem.freq', st.defs.freq);
    Toast.show((mains.length ? U.plural(mains.length, 'client') + ' imported' : '') + (extras.length ? (mains.length ? ' (+' + U.plural(extras.length, 'more GSTIN') + ')' : U.plural(extras.length, 'GSTIN') + ' added to existing clients') : '') + (ok.length ? ' · ' + U.plural(created, 'workflow') + ' created with due dates' : '') + (upd.length ? (ok.length ? ' · ' : '') + U.plural(upd.length, 'client') + ' updated' : ''), { undo: true });
    Router.go('clients');
  }
};

  simulate(db, T) {
    let seed = 11; const rnd = n => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };
    const minD = (a, b) => a < b ? a : b, maxD = (a, b) => a > b ? a : b;
    const cl = name => db.clients.find(c => c.name === name);

    const refFor = (s, date, c) => { const n = () => String(100000 + rnd(899999)); if (!s.ref) return ''; if (/ARN/.test(s.ref)) return 'AA' + (c.state || '33') + date.slice(5, 7) + date.slice(2, 4) + n() + String.fromCharCode(65 + rnd(26)); if (/Ack/.test(s.ref)) return '1' + n() + n() + '81'; if (/Token/.test(s.ref)) return '0' + n() + n() + '5'; if (/CIN|CPIN/.test(s.ref)) return '0510308' + date.replace(/-/g, '').slice(2) + n().slice(0, 5); if (/UDIN/.test(s.ref)) return '26' + n() + 'BKAB' + n().slice(0, 4); return n(); };
    const log = (w, c, date, text, act) => db.log.push({ ts: date + 'T' + U.pad(10 + rnd(8)) + ':' + U.pad(rnd(60)) + ':00', cid: c.id, wid: w.id, act: act || 'stage', text });

      let cursor = minD(U.addDays(Periods.end(w), 1 + rnd(4)), U.addDays(T, -1));
      for (const s of stages) {
        if (!w.stages[s.key]) {
          let date;
          if (opts.at && opts.at[s.key]) date = opts.at[s.key];
          else { const due = D.stageDue(w, s, c); date = due ? maxD(cursor, U.addDays(due, -1 - rnd(4))) : minD(U.addDays(cursor, rnd(3)), U.addDays(T, -1)); if (s.event && w.stages[s.event]) date = U.addDays(w.stages[s.event].date, 1 + rnd(3)); }
          date = minD(date, T); cursor = date;
          const rec = { date }; const ref = refFor(s, date, c); if (ref && (s.kind === 'file' || s.kind === 'verify')) rec.ref = ref;
          w.stages[s.key] = rec;
          if (s.kind === 'file' || s.key === last) log(w, c, date, TPL[w.tpl].name + ' · ' + Periods.label(w) + ' — ' + s.label + (rec.ref ? ' (' + s.ref + ': ' + rec.ref + ')' : ''), s.key === stages[stages.length - 1].key ? 'complete' : 'stage');
        } else cursor = w.stages[s.key].date;
        if (s.key === 'data') w.data = { status: 'received', requestedOn: U.addDays(w.stages.data.date, -3), receivedOn: w.stages.data.date, reminders: [U.addDays(w.stages.data.date, -3)] };
        if (s.key === last) break;
      }
      if (last === stages[stages.length - 1].key) w.completedAt = w.stages[last].date;
      w.updatedAt = w.stages[last].date + 'T12:00:00';
    };
    const request = (w, daysAgo, reminders) => { const c = db.clients.find(x => x.id === w.clientId); const on = U.addDays(T, -daysAgo); w.data = { status: 'requested', requestedOn: on, reminders: [on].concat(reminders || []) }; log(w, c, on, TPL[w.tpl].name + ' · ' + Periods.label(w) + ' — data requested via WhatsApp', 'request'); };
    const handled = new Set();
    const special = (w, fn) => { if (!w) return; handled.add(w.id); fn(w); };
    const lastOf = (c, tpl, k = 1) => { const l = wfs(c, tpl); return l[l.length - k]; };

    // --- manual matters: notices, certificate, general task
    const mk = (cname, tpl, title, due, extra) => { const c = cl(cname); const w = { id: Store.nextId('wf'), key: null, clientId: c.id, tpl, fy: U.fyOf(T), period: 'M', title, auto: false, due, stages: {}, data: { status: 'none' }, notes: '', createdAt: U.addDays(T, -20) + 'T11:00:00', updatedAt: U.stamp() }; Object.assign(w, extra || {}); db.workflows.push(w); log(w, c, w.createdAt.slice(0, 10), 'Created ' + TPL[tpl].name.toLowerCase() + ': ' + title, 'create'); return w; };
    const n1 = mk('Vetri Steels', 'notice', 'ASMT-10 u/s 61 — GST', U.addDays(T, 3), { notice: { dept: 'GST', act: 'CGST Act, 2017', type: 'ASMT-10 (scrutiny of returns)', section: '61', din: 'ZD3309260123456', noticeDate: U.addDays(T, -20) }, notes: 'ITC mismatch GSTR-2B vs 3B for FY 2024-25 (₹1.84 lakh). Reconciliation prepared.' });

function rollFY() {
  const cur = U.fyOf(U.today()), m = Store.db.meta, was = m.fySeen || (m.lastBrief ? U.fyOf(m.lastBrief) : cur);

   browser may evict IndexedDB of a site it judges unimportant. Clearing site data by hand still erases it. */
const Persist = {
  state: null, // true protected · false not (yet) · null API not available
  async check(ask) {
    const s = navigator.storage;
    if (!s || !s.persisted) { Persist.state = null; return null; }
    try { let p = await s.persisted(); if (!p && ask && s.persist) p = await s.persist(); Persist.state = !!p; } catch (e) { Persist.state = false; }
    return Persist.state;
  }

   holds a Recovery Key. Server rules: staff never receive fee records and may change only workflows and
   client details; settings, rules, accountants, fees and logins are the admin's. A record is saved only if
   nobody changed it meanwhile (version check), so two people never overwrite each other unseen. */

-- leaves your devices, so Supabase (and anyone who gets into the database) sees only gibberish.

);

})();

/* One tab writes, every other tab is read-only. The first tab to open holds a Web Lock; a second tab shows the
   data (refreshed whenever the writing tab saves) but cannot change it, so two tabs never overwrite each
   other. "Edit in this tab" moves the writing role: the other tab saves, steps down and becomes read-only. */
const Tabs = {
  role: 'solo', // writer · reader · solo (no Web Locks: the old warning banner only)
  bc: null, release: null,
  init() {
    if (Store.mode === 'cloud') { Tabs.role = 'cloud'; return Promise.resolve('cloud'); } // online office: every tab saves with a version check
    try { Tabs.bc = new BroadcastChannel('officeflow'); } catch (e) { Tabs.bc = null; }
    const L = navigator.locks;
    if (Tabs.bc) Tabs.bc.onmessage = ev => Tabs.msg(ev.data);
    if (!L || !L.request) { // old browser: warn only
      if (Tabs.bc) { Tabs.bc.postMessage('hello'); }
      return Promise.resolve('solo');
    }
    return new Promise(res => {
      L.request('officeflow-writer', { ifAvailable: true }, lock => {
        if (!lock) { Tabs.role = 'reader'; Store.readOnly = true; res('reader'); return; }
        Tabs.role = 'writer'; res('writer');
        return new Promise(r => { Tabs.release = r; }); // held until this tab closes or hands over
      }).catch(() => { Tabs.role = 'solo'; res('solo'); });
    });
  },
  async msg(m) {
    if (m === 'hello') { if (Tabs.role === 'solo') { Tabs.bc.postMessage('here'); UI.otherTab = true; UI.renderBanner(); } return; }
    if (m === 'here' && Tabs.role === 'solo') { UI.otherTab = true; UI.renderBanner(); return; }
    if (m === 'saved' && Tabs.role === 'reader') return Tabs.reload();
    if (m === 'bye' && Tabs.role === 'reader') { // the editing tab closed: the first read-only tab to get the lock edits now
      setTimeout(() => navigator.locks.request('officeflow-writer', { ifAvailable: true }, lock => {
        if (!lock || Tabs.role !== 'reader') return;
        Tabs.role = 'writer'; Store.readOnly = false;
        Tabs.reload().then(() => { Gen.run({ silent: true }); UI.renderBanner(); Toast.show('The other tab was closed — you can edit in this tab now'); });
        return new Promise(r => { Tabs.release = r; });
      }), 300);
      return;
    }
    if (m === 'yield' && Tabs.role === 'writer') { // another tab wants to edit: save, step down
      await Store.flush(); Tabs.role = 'reader'; Store.readOnly = true; const r = Tabs.release; Tabs.release = null; if (r) r();
      UI.renderBanner(); Toast.show('Editing moved to the other tab — this tab is now read-only');
    }
  },
  async reload() { const fy = Store.db.settings.fy; await Store.load(Store.mode); if (Store.mode === Store.db.mode) Store.db.settings.fy = fy; UI.refresh(); },
  // this (read-only) tab becomes the one that writes
  take() {
    if (Tabs.role !== 'reader') return;
    Toast.show('Taking over editing…');
    navigator.locks.request('officeflow-writer', lock => {
      Tabs.role = 'writer'; Store.readOnly = false;
      Tabs.reload().then(() => { Gen.run({ silent: true }); UI.renderBanner(); Toast.show('You can edit in this tab now'); });
      return new Promise(r => { Tabs.release = r; });
    });
    if (Tabs.bc) Tabs.bc.postMessage('yield');
  },
  saved() { if (Tabs.role === 'writer' && Tabs.bc) Tabs.bc.postMessage('saved'); },
  bye() { if (Tabs.role === 'writer' && Tabs.bc) { const r = Tabs.release; Tabs.release = null; Tabs.role = 'closing'; if (r) r(); Tabs.bc.postMessage('bye'); } }
};

/* ============================ INPUT HANDLERS =============================== */
const In = {
  fy: el => setFY(el.value),
  'work-q': U.debounce(el => { S.work.q = el.value; S.limit = 100; Views.work.renderList(); }, 120),
  work: el => { S.work[el.dataset.k] = el.value; S.limit = 100; if (['sort', 'groupBy'].includes(el.dataset.k)) Views.work.renderList(); else UI.render(); },
  'clients-q': U.debounce(el => { S.clients.q = el.value; Views.clients.renderList(); }, 120),
  'clients-cat': el => { S.clients.cat = el.value; Views.clients.renderList(); },
  'clients-acct': el => { S.clients.acct = el.value; Views.clients.renderList(); },
  'acct-fy': el => { S.acctFy = el.value; UI.render(); },
  'ref-all': el => $$('[data-ref-pick]').forEach(x => { x.checked = el.checked; }),
  rep: el => { S.rep[el.dataset.k] = el.value; UI.render(); },
  'log-q': U.debounce(el => { S.log.q = el.value; UI.render(); restoreFocus({ id: 'logq' }); const i = $('#logq'); if (i) { i.setSelectionRange(i.value.length, i.value.length); } }, 200),
  'wf-req': el => Store.mutate('Requirement', db => { const w = db.workflows.find(x => x.id === el.dataset.id); w.data = Object.assign({}, w.data, { requirement: el.value.trim() }); }, { undo: false, silent: true }),
  'doc-new': el => { if (el.value.trim()) DocUi.add(el.dataset.id, el.value); }, // Enter (or leaving the box) adds it
  'wf-notes': el => Store.mutate('Notes', db => { const w = db.workflows.find(x => x.id === el.dataset.id); WF.setNotes(db, w, el.value); }, { undo: false, silent: true }),
  'client-notes': el => Store.mutate('Client notes', db => { const c = db.clients.find(x => x.id === el.dataset.id); c.internal = Object.assign({}, c.internal, { notes: el.value }); c.updatedAt = U.stamp(); }, { undo: false, silent: true }),
  rule: el => { const v = parseInt(el.value, 10), p = el.dataset.k, max = p === 'month' ? 12 : p === 'days' ? 365 : 31; if (!(v >= 1 && v <= max)) return Toast.err('Enter a value between 1 and ' + max);
    Store.mutate('Edit rule', db => { const o = db.rules[el.dataset.id] = db.rules[el.dataset.id] || {}; const from = Rules.cfg(el.dataset.id)[p]; o[p] = v; o.updated = U.stamp(); Log.add(db, { act: 'rule', text: 'Due-date rule changed: ' + Rules.DEF[el.dataset.id].name + ' (' + p + ')', from: String(from), to: String(v) }); }); Toast.show('Rule updated — all due dates recalculated', { undo: true }); },
  'tpl-off': el => Store.mutate('Template auto', db => { if (el.checked) delete db.settings.tplOff[el.dataset.id]; else db.settings.tplOff[el.dataset.id] = true; Log.add(db, { act: 'template', text: 'Auto-generation ' + (el.checked ? 'enabled' : 'disabled') + ' for ' + TPL[el.dataset.id].name }); }, { undo: false }),
  'tpl-buffer': el => Store.mutate('Buffer', db => { const v = Math.max(0, Math.min(30, parseInt(el.value, 10) || 0)); db.settings.tplBuffer[el.dataset.id] = v; }, { undo: false, silent: true }),
  'tpl-req': el => Store.mutate('Requirement text', db => { db.settings.tplReq[el.dataset.id] = el.value.trim(); }, { undo: false, silent: true }),
  msg: el => Store.mutate('Message', db => { db.settings.msg[el.dataset.k] = el.value; }, { undo: false, silent: true }),
  setting: el => Store.mutate('Setting', db => { let v = el.value.trim(); if (el.dataset.num) v = Math.max(0, Math.min(60, parseInt(v, 10) || 0)); db.settings[el.dataset.k] = v; }, { undo: false, silent: true }),
  'setting-bool': el => Store.mutate('Setting', db => { db.settings[el.dataset.k] = el.checked; }, { undo: false, silent: true }),
  automation: el => Store.mutate('Automation', db => { db.settings.automation[el.dataset.k] = el.checked; Log.add(db, { act: 'automation', text: 'Automation "' + (AUTOMATIONS.find(a => a.id === el.dataset.k) || {}).trigger + '" ' + (el.checked ? 'enabled' : 'disabled') }); }, { undo: false }),
  trackfrom: el => { if (!U.isDate(el.value)) return; Store.mutate('Track from', db => { db.meta.trackFrom = el.value; }, { undo: false, silent: true }); Gen.run({ silent: true }); }
};
const LIVE = new Set(['work-q', 'clients-q', 'log-q']);

/* ============================== GLOBAL EVENTS ============================== */
document.addEventListener('click', e => {
  if (e.target.closest('.modal [data-mact]') || e.target.closest('.popover') || e.target.closest('.cmd')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = Act[el.dataset.act]; if (!fn) return;
  if (el.type !== 'checkbox') e.preventDefault();
  if (el.closest('.popover')) Pop.close();
  try { fn(el, e); } catch (err) { if (err && err.ro) return; console.error(err); Toast.err('Something went wrong: ' + err.message); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && LIVE.has(el.dataset.in)) In[el.dataset.in](el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && !LIVE.has(el.dataset.in) && In[el.dataset.in]) In[el.dataset.in](el); });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return Cmd.isOpen() ? Cmd.close() : Cmd.open(); }
  if (e.key === 'Escape') {
    if (Pop.cur) { Pop.close(); return; }
    if (Cmd.isOpen()) { Cmd.close(); return; }
    const m = Modal.top(); if (m) { m.close(undefined); return; }
    if (S.drawer) { Drawer.close(); return; }
    return;
  }
  if (e.key === 'Enter' && !typing) { const el = e.target.closest('[role="button"][data-act]'); if (el) { e.preventDefault(); el.click(); return; } }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || Modal.top() || Cmd.isOpen()) return;
  const k = e.key.toLowerCase();
  const map = { '/': () => Cmd.open(), n: () => TaskForm.open(), c: () => ClientForm.open(), t: () => Router.go('dashboard'), w: () => { S.work.preset = 'today'; Router.go('work'); }, l: () => Router.go('calendar'), b: () => Brief.open(), e: () => Eod.open(), '?': () => Router.go('more/help') };
  if (map[e.key] || map[k]) { e.preventDefault(); Drawer.close(); (map[e.key] || map[k])(); }
});
// Focus trap for modals & drawer
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const box = (Modal.top() && Modal.top().el) || (Cmd.isOpen() && $('.cmd')) || (S.drawer && $('#drawerRoot .drawer'));
  if (!box) return;
  const f = $$('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,a[href],[tabindex="0"]', box).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  else if (!box.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
});

/* ================================= BOOT ==================================== */
async function boot() {
  $('#layer').innerHTML = '<div id="drawerRoot"></div><div id="modalRoot"></div><div id="popRoot"></div><div id="cmdRoot"></div>';
  try { await Store.init(); } catch (e) { document.body.innerHTML = '<p style="padding:30px;font-family:sans-serif">' + APP_NAME + ' could not open browser storage: ' + E(e.message) + '</p>'; return; }
  if (await Cloud.boot()) { await Store.load('cloud'); Cloud.startPolling(); } // online office: sign in, unlock and download first
  await Tabs.init(); // read-only when another tab already writes
  window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.ro) ev.preventDefault(); }); // refused in a read-only tab: the toast said so
  window.addEventListener('error', ev => { if (ev.error && ev.error.ro) ev.preventDefault(); });
  Persist.check(true).then(() => { if (/more\/data/.test(location.hash)) UI.render(); });
  BackupDir.name = Store.lsGet('of.backupDir', '');
  BackupDir.get().then(h => { if ((h ? h.name : '') !== BackupDir.name) { BackupDir.name = h ? h.name : ''; UI.render(); } });
  Theme.apply();
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Theme.apply());
  if (!location.hash) history.replaceState(null, '', '#/dashboard');
  Gen.run({ silent: true });
  rollFY();
  Router.apply();
  if (!Store.db.meta.setupDone && Store.mode === 'real') { if (!Store.readOnly) Setup.open(); } else Brief.maybe();
  if (Cloud.on) Toast.show('Signed in as ' + Cloud.me.name + (Cloud.staff ? ' (staff)' : ' (admin)'));
  // Day change: regenerate periods, refresh derived dates, show brief
  let day = U.today();
  setInterval(() => { if (U.today() !== day) { day = U.today(); Gen.run({ silent: true }); rollFY(); UI.refresh(); Brief.maybe(); Backup.auto(); } }, 60000);
  setTimeout(() => Backup.auto(), 3000); // daily automatic backup into the chosen folder
  UI.renderBanner();
  window.addEventListener('pagehide', () => { Store.flush().then(() => Tabs.bye()); });
  window.addEventListener('pageshow', ev => { if (ev.persisted && Tabs.role === 'closing') location.reload(); }); // back from the browser cache: claim a role afresh
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); });
}
// Test / integration hook (read-only use recommended)
window.OfficeFlow = { U, V, Store, Rules, TPL, Applic, Periods, Gen, D, WF, Auto, Demo, Backup, Importer, Exporter, Reports, Matrix, Views, S, UI, Router, PRESETS, Stage, Remind, Bulk, Cmd, ExtendDue, ClientForm, Drawer, Dsc, DscRep, DscUi, Docs, DocUi, DocRep, Letters, TaskForm, AuditorResign, Gstins, Xlsx, BackupDir, REPORTS, REP_FILTERS, DSC_FILTERS, MORE_TITLES, Brief, Eod, Notifs, Cal, Waiting, rollFY, Partner, itrRule, itrWhy, itrDsc, RuleExt, Act, Tabs, Persist, Ref, RefUi, RefRep, FileDocs, Cloud, Log, MoreViews };
boot();
</script>
